# Databricks Asset Bundle (DAB) Configuration for Silver Layer ETL Pipeline
# This example shows a complete production-ready configuration for a silver layer pipeline

bundle:
  name: silver_layer_etl_pipeline
  
# Target environments for deployment
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://your-workspace.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev
    
    variables:
      catalog: dev_catalog
      schema: silver
      source_catalog: dev_catalog
      source_schema: bronze
      environment: dev
      cluster_size: Small
      
  staging:
    mode: production
    workspace:
      host: https://your-workspace.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/staging
    
    variables:
      catalog: staging_catalog
      schema: silver
      source_catalog: staging_catalog
      source_schema: bronze
      environment: staging
      cluster_size: Medium
      
  prod:
    mode: production
    workspace:
      host: https://your-workspace.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/prod
    
    variables:
      catalog: prod_catalog
      schema: silver
      source_catalog: prod_catalog
      source_schema: bronze
      environment: prod
      cluster_size: Large

# Variables that can be referenced throughout the bundle
variables:
  catalog:
    description: Unity Catalog name
  schema:
    description: Schema name for silver layer tables
  source_catalog:
    description: Source catalog (bronze layer)
  source_schema:
    description: Source schema (bronze layer)
  environment:
    description: Deployment environment
  cluster_size:
    description: Cluster size for compute

# Resources to be deployed
resources:
  
  # Delta Live Tables Pipeline for continuous processing
  pipelines:
    silver_customer_pipeline:
      name: "${var.environment}_silver_customer_pipeline"
      
      # Pipeline configuration
      catalog: ${var.catalog}
      target: ${var.schema}
      
      # Compute configuration
      clusters:
        - label: default
          node_type_id: i3.xlarge
          num_workers: 2
          autoscale:
            min_workers: 1
            max_workers: 5
          
      # Pipeline settings
      configuration:
        pipeline.environment: ${var.environment}
        source.catalog: ${var.source_catalog}
        source.schema: ${var.source_schema}
        
      # Enable change data feed for downstream consumers
      channel: CURRENT
      
      # Development mode for faster iteration
      development: ${{ targets.dev.mode == 'development' }}
      
      # Continuous or triggered
      continuous: false
      
      # Pipeline libraries (notebooks and SQL files)
      libraries:
        - notebook:
            path: ./pipelines/silver_customer_dlt.py
        - notebook:
            path: ./pipelines/silver_orders_dlt.py
        - file:
            path: ./transformations.sql
            
      # Enable photon for better performance
      photon: true
      
      # Notifications on pipeline events
      notifications:
        - email_recipients:
            - data-engineering@company.com
          alerts:
            - on-update-failure
            - on-flow-failure
  
  # Scheduled Job for batch processing
  jobs:
    silver_layer_batch_job:
      name: "${var.environment}_silver_layer_batch"
      
      # Job schedule - run daily at 2 AM UTC
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
        
      # Timeout settings
      timeout_seconds: 7200  # 2 hours
      max_concurrent_runs: 1
      
      # Email notifications
      email_notifications:
        on_failure:
          - data-engineering@company.com
        on_success:
          - data-engineering@company.com
          
      # Job tasks
      tasks:
        # Task 1: Run data quality checks on bronze layer
        - task_key: validate_bronze_data
          notebook_task:
            notebook_path: ./scripts/validate_bronze.py
            base_parameters:
              catalog: ${var.source_catalog}
              schema: ${var.source_schema}
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
            spark_conf:
              spark.databricks.delta.properties.defaults.enableChangeDataFeed: "true"
              spark.databricks.delta.optimizeWrite.enabled: "true"
              
        # Task 2: Transform customer data (depends on Task 1)
        - task_key: transform_customers
          depends_on:
            - task_key: validate_bronze_data
          python_wheel_task:
            package_name: silver_transformations
            entry_point: transform_customers
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.schema}
              - --source-catalog=${var.source_catalog}
              - --source-schema=${var.source_schema}
              - --load-id={{ run_id }}
          libraries:
            - whl: ./dist/silver_transformations-*.whl
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 3
            
        # Task 3: Transform orders data (runs in parallel with Task 2)
        - task_key: transform_orders
          depends_on:
            - task_key: validate_bronze_data
          notebook_task:
            notebook_path: ./notebooks/transform_orders.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              load_id: "{{ run_id }}"
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 3
            
        # Task 4: Run data quality checks on silver layer
        - task_key: validate_silver_data
          depends_on:
            - task_key: transform_customers
            - task_key: transform_orders
          notebook_task:
            notebook_path: ./scripts/validate_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
            
        # Task 5: Optimize tables (Z-order, vacuum)
        - task_key: optimize_tables
          depends_on:
            - task_key: validate_silver_data
          notebook_task:
            notebook_path: ./scripts/optimize_tables.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
      
      # Job-level configuration
      tags:
        environment: ${var.environment}
        layer: silver
        team: data-engineering
        
  # Job for unit tests (runs on PR/merge)
  jobs:
    silver_layer_tests:
      name: "${var.environment}_silver_layer_tests"
      
      tasks:
        - task_key: run_unit_tests
          python_wheel_task:
            package_name: silver_transformations
            entry_point: run_tests
          libraries:
            - whl: ./dist/silver_transformations-*.whl
            - pypi:
                package: pytest
            - pypi:
                package: pytest-spark
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 1

# Include additional resource files
include:
  - ./resources/*.yml

# Permissions for the bundle resources
permissions:
  - level: CAN_MANAGE
    group_name: data-engineering
  - level: CAN_VIEW
    group_name: data-analysts

# Artifacts to be uploaded (Python wheels, JARs, etc.)
artifacts:
  silver_transformations:
    type: whl
    path: ./dist
    build: python setup.py bdist_wheel
