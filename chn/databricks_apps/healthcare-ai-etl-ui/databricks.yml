bundle:
  name: healthcare-ai-etl-ui

workspace:
  host: https://adb-7405607609261208.8.azuredatabricks.net

resources:
  apps:
    healthcare_ai_etl_ui:
      name: "[${workspace.current_user.short_name}] Healthcare AI ETL Platform"
