# Databricks Asset Bundle: Patient Readmission Analysis
# Scalable configuration for CHN ETL Demo project
# Supports multiple environments and follows DAB best practices

bundle:
  name: chn_patient_readmission

# Include external configuration files for modularity
include:
  - config/*.yml

variables:
  # Project identification
  project_name:
    description: Project name for resource naming
    default: patient_readmission
  
  # Environment
  environment:
    description: Deployment environment (dev, staging, prod)
    default: dev
  
  # Catalog configuration
  catalog_name:
    description: Unity Catalog name
    default: chn_etl_demo_catalog
  
  schema_name:
    description: Schema name for project resources
    default: patient_readmission
  
  # Warehouse configuration  
  warehouse_name:
    description: SQL Warehouse for queries and dashboards
    default: Shared Unity Catalog Serverless
  
  warehouse_id:
    lookup:
      warehouse: ${var.warehouse_name}
  
  # Workspace paths
  workspace_root:
    description: Root workspace path for project
    default: /Users/${workspace.current_user.userName}/chn_etl_demo
  
  workspace_path:
    description: Project-specific workspace path
    default: ${var.workspace_root}/${var.project_name}

# Workspace file synchronization
workspace:
  file_path: ${var.workspace_path}

sync:
  include:
    - src/*.py
    - src/*.sql
    - src/*.json
  exclude:
    - "**/__pycache__"
    - "**/.pytest_cache"
    - "**/*.pyc"

# Target environments
targets:
  # Development environment
  dev:
    default: true
    mode: development
    workspace:
      host: https://fe-sandbox-chn-etl-demo.cloud.databricks.com
      root_path: ${var.workspace_path}/.bundle/${bundle.name}/dev
    variables:
      environment: dev
      catalog_name: chn_etl_demo_catalog
      schema_name: ${var.project_name}_dev
  
  # Production environment
  prod:
    mode: production
    workspace:
      host: https://fe-sandbox-chn-etl-demo.cloud.databricks.com
      root_path: ${var.workspace_path}/.bundle/${bundle.name}/prod
    variables:
      environment: prod
      catalog_name: chn_etl_demo_catalog
      schema_name: ${var.project_name}_prod
    # Production-specific permissions
    permissions:
      - level: CAN_MANAGE
        group_name: data_engineering
      - level: CAN_VIEW
        group_name: business_users

# Resource definitions
resources:
  # Unity Catalog Schema
  schemas:
    project_schema:
      name: ${var.schema_name}
      catalog_name: ${var.catalog_name}
      comment: "Patient readmission analysis - ${var.environment} environment"
      properties:
        project: patient_readmission
        environment: ${var.environment}
        managed_by: databricks_asset_bundle
  
  # Managed Volume for raw data
  volumes:
    raw_data_volume:
      name: raw_data
      catalog_name: ${var.catalog_name}
      schema_name: ${var.schema_name}
      volume_type: MANAGED
      comment: "Raw data storage for patient readmission analysis - ${var.environment}"
  
  # Data Pipeline Job
  jobs:
    patient_readmission_pipeline:
      name: "[${var.environment}] Patient Readmission Pipeline"
      description: "End-to-end data pipeline: generation → transformation → deployment"
      
      tags:
        project: patient_readmission
        environment: ${var.environment}
        managed_by: dab
      
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      
      tasks:
        # Task 1: Generate synthetic data
        - task_key: generate_data
          description: "Generate synthetic ER visit data using Faker"
          spark_python_task:
            python_file: ./src/generate_data.py
            source: WORKSPACE
          
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
            spark_env_vars:
              CATALOG: ${var.catalog_name}
              SCHEMA: ${var.schema_name}
              VOLUME: raw_data
              ENVIRONMENT: ${var.environment}
          
          libraries:
            - pypi:
                package: faker>=19.0.0
            - pypi:
                package: pandas>=2.0.0
            - pypi:
                package: numpy>=1.24.0
          
          max_retries: 1
          timeout_seconds: 3600
        
        # Task 2: SQL Transformations (Bronze → Silver → Gold)
        - task_key: sql_transformations
          description: "Execute medallion architecture transformations"
          depends_on:
            - task_key: generate_data
          
          sql_task:
            file:
              path: ./src/transformations.sql
            warehouse_id: ${var.warehouse_id}
          
          max_retries: 1
          timeout_seconds: 1800
        
        # Task 3: Deploy Agent Bricks (Genie, Dashboards)
        - task_key: deploy_resources
          description: "Deploy Genie spaces and dashboards"
          depends_on:
            - task_key: sql_transformations
          
          spark_python_task:
            python_file: ./src/deploy_resources.py
            source: WORKSPACE
          
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 0  # Single node for deployment
            spark_env_vars:
              CATALOG: ${var.catalog_name}
              SCHEMA: ${var.schema_name}
              ENVIRONMENT: ${var.environment}
          
          libraries:
            - pypi:
                package: databricks-sdk>=0.18.0
          
          max_retries: 1
          timeout_seconds: 1800
      
      # Job-level cluster configuration (optional, for job clusters)
      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
            spark_conf:
              spark.databricks.cluster.profile: serverless
              spark.databricks.delta.preview.enabled: "true"
  
  # Lakeview Dashboard
  dashboards:
    er_staffing_dashboard:
      display_name: "[${var.environment}] ER Staffing, Access, Quality & Financial Risk"
      file_path: ./src/dashboard_lakeview_er_staffing_quality.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.workspace_root}/dashboards

# Permissions (environment-specific overrides in targets)
permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}
